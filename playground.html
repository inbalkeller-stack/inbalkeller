<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground | Inbal Keller</title>
  <link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body class="theme-playground">

<div class="layout">
  <aside class="sidebar">
    <div class="pg-side__video crop" style="--w:100%; --fx:-50%; --fy:-79.3%; background-image:url(images/playground-pottery-poster.jpg)">
      <video src="web-videos/pottery.mp4" autoplay muted loop playsinline></video>
    </div>
    <nav class="snav" aria-label="Main menu">
      <a class="snav__row" href="about.html">Inbal keller</a>
      <span class="snav__current" aria-current="page">playground</span>
      <a class="snav__row" href="index.html">projects</a>
    </nav>
  </aside>

  <main class="content">
    <div class="pg-stack">
      <img class="block-img" src="images/playground-1.jpg" alt="Floral drawing with the oboe player illustration" width="1972" height="1800" loading="lazy">
      <img class="block-img" src="images/playground-2.jpg" alt="Floral drawing and painting" width="1972" height="1800" loading="lazy">
      <img class="block-img" src="images/playground-3.jpg" alt="Watercolor postcards" width="1972" height="1700" loading="lazy">
      <img class="block-img" src="images/playground-4.jpg" alt="Photographed catalogue: Al HaRosh" width="1972" height="1670" loading="lazy">
      <div class="pg-video pg-video--interceptor">
        <video src="web-videos/interceptor.mp4" poster="images/playground-interceptor-poster.jpg" autoplay muted loop playsinline></video>
      </div>
      <div class="pg-video pg-video--stutter">
        <video src="web-videos/stutter.mp4" poster="images/playground-stutter-poster.jpg" autoplay muted loop playsinline></video>
      </div>
    </div>
    <div class="pg-tail" aria-hidden="true"></div>
  </main>
</div>

</body>
</html>
